<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Blue Sport | البث المباشر</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --bg-primary: #030303;
            --bg-card: #161921;
            --glass-bg: rgba(22, 25, 33, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: #F1F5F9;
            --text-secondary: #94A3B8;
            --accent-primary: #0055EF;
            --live-red: #E53935;
            --radius: 12px;
        }
        body {
            background: var(--bg-primary);
            font-family: 'Cairo', sans-serif;
            color: var(--text-primary);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(ellipse at 50% 0%, rgba(0,85,239,0.08) 0%, transparent 60%);
        }
        header {
            height: 64px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(3,3,3,0.8);
            backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--glass-border);
        }
        .header-logo { height: 40px; filter: drop-shadow(0 0 8px rgba(0,85,239,0.5)); }
        .icon-btn {
            width: 42px; height: 42px; border: none; border-radius: var(--radius);
            background: var(--glass-bg); backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border); color: #fff;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }
        .menu-overlay {
            position: fixed; inset: 0; background: rgba(3,3,3,0.95);
            backdrop-filter: blur(24px); z-index: 2000;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.4s;
        }
        .menu-overlay.active { opacity: 1; pointer-events: auto; }
        .menu-close {
            position: absolute; top: 24px; right: 24px;
            background: rgba(255,255,255,0.1); border: none;
            border-radius: var(--radius); width: 44px; height: 44px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }
        .menu-links { display: flex; flex-direction: column; gap: 8px; width: 80%; max-width: 320px; }
        .menu-link {
            display: block; padding: 14px 20px; border-radius: var(--radius);
            background: rgba(255,255,255,0.03); color: var(--text-primary);
            text-decoration: none; font-weight: 600; text-align: center;
        }
        .menu-link:hover { background: rgba(0,85,239,0.2); }
        .ad-container { width: 100%; background: #000; }
        .ad-aspect { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #0a0a0a; }
        .ad-slide {
            position: absolute; inset: 0; background-size: cover; background-position: center;
            opacity: 0; transition: opacity 0.6s ease; display: flex;
            align-items: center; justify-content: center;
            font-weight: bold; text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
        .ad-slide.active { opacity: 1; z-index: 1; }
        .ad-dots { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 10; }
        .ad-dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.4); cursor: pointer; }
        .ad-dot.active { background: #fff; transform: scale(1.3); }
        .section-header { padding: 28px 20px 16px; display: flex; align-items: center; justify-content: space-between; flex-direction: row-reverse; }
        .section-title { font-size: 1.3rem; font-weight: 800; }
        .section-logo { height: 36px; width: 36px; border-radius: 8px; object-fit: contain; background: rgba(0,85,239,0.15); padding: 4px; }
        .channels-grid { padding: 0 20px 30px; display: grid; grid-template-columns: repeat(2,1fr); gap: 14px; }
        .channel-card {
            position: relative; border-radius: var(--radius); overflow: hidden;
            background: var(--bg-card); cursor: pointer; aspect-ratio: 20 / 13;
            transition: 0.25s; border: 1px solid transparent;
            text-decoration: none; color: inherit; display: block;
        }
        .channel-card:hover { box-shadow: 0 12px 28px rgba(0,85,239,0.45); border-color: var(--accent-primary); transform: translateY(-4px); }
        .channel-image { width: 100%; height: 100%; object-fit: cover; }
        .channel-gradient { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.1) 50%, transparent 100%); pointer-events: none; }
        .channel-title { position: absolute; bottom: 12px; left: 10px; right: 10px; text-align: center; font-size: 14px; font-weight: 700; text-shadow: 0 2px 6px rgba(0,0,0,0.7); }
        .player-overlay {
            position: fixed; inset: 0; background: #000; z-index: 3000;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .player-overlay.active { opacity: 1; pointer-events: auto; }
        .player-wrapper { width: 100%; height: 100%; position: relative; background: #000; overflow: hidden; }
        #videoPlayer { width: 100%; height: 100%; object-fit: contain; background: #000; }
        .player-loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
            width: 48px; height: 48px; border: 4px solid rgba(255,255,255,0.2);
            border-top-color: var(--accent-primary); border-radius: 50%;
            animation: spin 0.8s linear infinite; z-index: 30; display: none;
        }
        .player-loading.show { display: block; }
        @keyframes spin { to { transform: translate(-50%,-50%) rotate(360deg); } }
        .resolving-message {
            position: absolute; bottom: 30%; left: 0; right: 0; text-align: center;
            color: white; background: rgba(0,0,0,0.6); padding: 8px; z-index: 32;
            font-size: 14px;
        }
        .player-error {
            position: absolute; inset: 0; background: rgba(0,0,0,0.85);
            backdrop-filter: blur(16px); display: none; flex-direction: column;
            align-items: center; justify-content: center; z-index: 31;
            gap: 16px; color: #fff; text-align: center;
        }
        .retry-btn { background: var(--accent-primary); border: none; padding: 8px 20px; border-radius: 40px; color: white; font-weight: bold; cursor: pointer; }
        .player-controls {
            position: absolute; bottom: 20px; left: 20px; right: 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            padding: 16px 12px 12px; border-radius: 16px; z-index: 35;
            display: flex; flex-direction: column; gap: 12px;
            transition: opacity 0.3s;
        }
        .player-top-bar { display: flex; justify-content: space-between; align-items: center; }
        .player-actions-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .player-btn {
            background: rgba(0,0,0,0.6); backdrop-filter: blur(12px);
            border: none; width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; cursor: pointer;
        }
        .volume-wrapper { display: flex; align-items: center; gap: 8px; }
        #volumeSlider { width: 80px; height: 4px; accent-color: var(--accent-primary); }
        .player-progress-wrapper { flex: 1; display: flex; align-items: center; gap: 12px; direction: ltr; }
        .progress-bar-container {
            flex: 1; height: 5px; background: rgba(255,255,255,0.2);
            border-radius: 5px; position: relative; cursor: pointer;
        }
        .progress-buffered { position: absolute; height: 100%; background: rgba(255,255,255,0.4); width: 0%; border-radius: 5px; }
        .progress-played { position: absolute; height: 100%; background: var(--accent-primary); width: 0%; border-radius: 5px; z-index: 2; }
        .progress-handle {
            position: absolute; width: 12px; height: 12px; background: white;
            border-radius: 50%; top: 50%; transform: translate(-50%, -50%);
            left: 0%; z-index: 3; opacity: 0;
        }
        .progress-bar-container:hover .progress-handle { opacity: 1; }
        .time-display { font-size: 12px; font-weight: 500; background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 20px; }
        .player-live-btn {
            background: var(--live-red); color: white; border: none;
            border-radius: 20px; padding: 6px 16px; font-weight: bold;
            font-size: 12px; cursor: pointer;
        }
        .player-live-btn.is-live { background: #2c2c2c; }
        .quality-pill {
            background: rgba(0,0,0,0.6); border-radius: 20px; padding: 6px 12px;
            font-size: 12px; display: flex; align-items: center; gap: 6px; cursor: pointer;
        }
        .quality-dropdown {
            position: absolute; bottom: 70px; right: 20px;
            background: #1e1e2e; backdrop-filter: blur(12px);
            border-radius: 12px; padding: 8px 0; min-width: 130px;
            display: none; flex-direction: column; z-index: 40;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .quality-option { background: transparent; border: none; padding: 10px 16px; color: white; text-align: right; cursor: pointer; font-size: 13px; }
        .quality-option.active { color: var(--accent-primary); font-weight: bold; }
        .player-close-btn {
            position: absolute; top: 20px; right: 20px; z-index: 45;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
            border: none; width: 44px; height: 44px; border-radius: 50%;
            color: white; display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }
        .autohide .player-controls { opacity: 0; pointer-events: none; }
        .autohide .player-close-btn { opacity: 0; }
        .toast-container { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 9999; pointer-events: none; }
        .toast { background: rgba(22,25,33,0.9); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); color: #fff; padding: 12px 24px; border-radius: 30px; font-weight: 600; display: flex; gap: 8px; opacity: 0; transform: translateY(20px); transition: 0.3s; white-space: nowrap; }
        .toast.show { opacity: 1; transform: translateY(0); }
        .site-footer { padding: 20px; text-align: center; border-top: 1px solid rgba(255,255,255,0.08); color: var(--text-secondary); font-size: 13px; }
        @media (min-width:768px) { .channels-grid { grid-template-columns: repeat(4,1fr); gap: 18px; } }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
</head>
<body>
<header>
    <div class="header-left"><img class="header-logo" src="https://i.postimg.cc/kGmCkdn1/20260607-170253.png" alt="Blue Sport"></div>
    <div class="header-right"><button class="icon-btn" id="menuToggle"><span class="material-icons-round">menu</span></button></div>
</header>
<div class="menu-overlay" id="menuOverlay">
    <button class="menu-close" id="menuCloseBtn"><span class="material-icons-round">close</span></button>
    <div class="menu-links">
        <a href="#" class="menu-link">الرئيسية</a><a href="#" class="menu-link">القنوات الرياضية</a>
        <a href="#" class="menu-link">جدول المباريات</a><a href="#" class="menu-link">تواصل معنا</a>
    </div>
</div>
<div class="ad-container"><div class="ad-aspect" id="adBanner"></div><div class="ad-dots" id="adDots"></div></div>
<div class="section-header"><h2 class="section-title">القنوات الرياضية</h2><img class="section-logo" src="https://i.postimg.cc/kGmCkdn1/20260607-170253.png" alt="Logo"></div>
<div class="channels-grid" id="channelsGrid"></div>

<div class="player-overlay" id="playerOverlay">
    <button class="player-close-btn" id="playerCloseBtn"><span class="material-icons-round">close</span></button>
    <div class="player-wrapper" id="playerWrapper">
        <video id="videoPlayer" preload="auto" playsinline></video>
        <div class="player-loading" id="playerLoading"></div>
        <div class="resolving-message" id="resolvingMsg" style="display:none;">جاري تجهيز البث (متابعة التوجيه)...</div>
        <div class="player-error" id="playerError">
            <span class="material-icons-round" style="font-size:48px">error_outline</span>
            <p id="playerErrorText">حدث خطأ في البث</p>
            <button class="retry-btn" id="manualRetryBtn">إعادة المحاولة</button>
        </div>
        <div class="player-controls" id="playerControls">
            <div class="player-top-bar">
                <div class="player-actions-row">
                    <button class="player-btn" id="btnPlayPause"><span class="material-icons-round">play_arrow</span></button>
                    <div class="volume-wrapper">
                        <button class="player-btn" id="btnMute"><span class="material-icons-round">volume_up</span></button>
                        <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1">
                    </div>
                    <button class="player-btn" id="btnFullscreen"><span class="material-icons-round">fullscreen</span></button>
                    <div class="quality-pill" id="btnQuality">جودة <span id="qualityTracker">تلقائي</span> <span class="material-icons-round" style="font-size:16px">arrow_drop_down</span></div>
                </div>
                <button class="player-live-btn" id="btnLive" style="display:none">مباشر</button>
            </div>
            <div class="player-progress-wrapper">
                <div class="time-display" id="currentTime">00:00</div>
                <div class="progress-bar-container" id="progressWrapper">
                    <div class="progress-buffered" id="progressBuffered"></div>
                    <div class="progress-played" id="progressPlayed"></div>
                    <div class="progress-handle" id="progressHandle"></div>
                </div>
                <div class="time-display" id="totalTime">00:00</div>
            </div>
        </div>
        <div class="quality-dropdown" id="qualityDropdown"></div>
    </div>
</div>
<div class="toast-container"><div class="toast" id="toast"></div></div>
<footer class="site-footer">جميع الحقوق محفوظة لـ <a href="https://t.me/blue_sport_tv" target="_blank">Team Blue Sport</a></footer>

<script src="player.js"></script>
</body>
</html>
