    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        /* ========== التصميم الأصلي للصفحة (بدون تغيير) ========== */
        :root {
            --bg-primary: #030303; --bg-secondary: #0F1117; --bg-card: #161921; --bg-elevated: #1E2130;
            --glass-bg: rgba(22, 25, 33, 0.7); --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: #F1F5F9; --text-secondary: #94A3B8; --text-muted: #64748B;
            --accent-primary: #D90C11; --accent-glow: rgba(217, 12, 17, 0.4);
            --radius: 12px; --radius-full: 9999px;
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body { background:var(--bg-primary); font-family:'Cairo',sans-serif; color:var(--text-primary); overflow-x:hidden; min-height:100vh; display:flex; flex-direction:column; }
        ::-webkit-scrollbar { width:4px; } ::-webkit-scrollbar-track { background:transparent; } ::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.12); border-radius:4px; }
        
        /* splash screen */
        .splash-screen { position:fixed; inset:0; background:var(--bg-primary); z-index:9999; display:flex; align-items:center; justify-content:center; transition:opacity 0.4s; }
        .splash-screen.hidden { opacity:0; pointer-events:none; }
        .splash-logo { width:160px; height:160px; object-fit:contain; margin-bottom:20px; filter:drop-shadow(0 0 25px rgba(255,255,255,0.4)); }
        .splash-loader { width:70px; height:4px; background:rgba(255,255,255,0.1); border-radius:4px; margin:0 auto; overflow:hidden; }
        .splash-loader::after { content:''; display:block; width:30%; height:100%; background:var(--accent-primary); border-radius:4px; animation:loading 1.2s ease-in-out infinite; }
        
        header { height:64px; padding:0 20px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:1000; background:rgba(3,3,3,0.8); backdrop-filter:blur(24px); border-bottom:1px solid var(--glass-border); }
        .header-left, .header-right { width:48px; display:flex; align-items:center; } .header-left { justify-content:flex-start; } .header-right { justify-content:flex-end; }
        .header-center { flex:1; display:flex; align-items:center; justify-content:center; }
        .main-logo { height:36px; object-fit:contain; }
        .icon-btn { width:42px; height:42px; border:none; border-radius:var(--radius); background:var(--glass-bg); backdrop-filter:blur(8px); border:1px solid var(--glass-border); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:0.2s; }
        .icon-btn:hover { background:rgba(255,255,255,0.12); }
        
        .search-bar-container { position:sticky; top:64px; z-index:999; background:rgba(3,3,3,0.9); backdrop-filter:blur(20px); padding:10px 20px; border-bottom:1px solid var(--glass-border); display:none; }
        .search-bar-container.active { display:block; }
        .search-bar { display:flex; align-items:center; gap:8px; background:rgba(255,255,255,0.05); border-radius:var(--radius-full); padding:6px 6px 6px 18px; border:1px solid rgba(255,255,255,0.1); }
        .search-bar input { flex:1; background:transparent; border:none; padding:10px 0; color:#fff; font-family:'Cairo'; font-size:15px; outline:none; }
        .search-bar .close-search { background:rgba(255,255,255,0.1); border:none; color:#fff; width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; }
        
        .menu-overlay { position:fixed; inset:0; background:rgba(3,3,3,0.95); backdrop-filter:blur(24px); z-index:2000; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity 0.4s; flex-direction:column; }
        .menu-overlay.active { opacity:1; pointer-events:auto; }
        .menu-close { position:absolute; top:24px; left:24px; background:rgba(255,255,255,0.1); border:none; border-radius:var(--radius); color:#fff; width:44px; height:44px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
        .social-links { display:flex; gap:20px; justify-content:center; margin-top:30px; }
        .social-link { display:flex; align-items:center; justify-content:center; width:50px; height:50px; border-radius:50%; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); color:#fff; text-decoration:none; font-size:24px; transition:0.2s; }
        .social-link:hover { background:var(--accent-primary); border-color:var(--accent-primary); transform:scale(1.05); }
        .app-section { margin-top:30px; text-align:center; }
        .app-logo { width:70px; height:70px; border-radius:16px; margin-bottom:10px; object-fit:contain; background:#1E2130; padding:8px; }
        .app-title { font-size:16px; font-weight:700; margin-bottom:6px; }
        .app-desc { font-size:13px; color:var(--text-secondary); margin-bottom:15px; }
        .download-btn { display:inline-flex; align-items:center; gap:8px; background:var(--accent-primary); color:#fff; padding:12px 24px; border-radius:var(--radius-full); text-decoration:none; font-weight:600; transition:opacity 0.2s; }
        
        .categories { display:flex; gap:8px; overflow-x:auto; padding:20px 16px 8px; }
        .category { padding:10px 20px; border-radius:var(--radius); background:var(--bg-card); color:var(--text-secondary); font-size:14px; font-weight:600; white-space:nowrap; cursor:pointer; border:1px solid transparent; transition:0.2s; }
        .category.active { background:var(--accent-primary); color:#fff; }
        .channels { padding:8px 12px 30px; display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
        .channel-card { position:relative; border-radius:var(--radius); overflow:hidden; background:var(--bg-card); cursor:pointer; aspect-ratio:20/13; border:1px solid transparent; transition:0.2s; }
        .channel-card:hover { border-color:var(--accent-primary); }
        .channel-image { width:100%; height:100%; object-fit:cover; }
        .channel-gradient { position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,0.8), transparent); }
        .channel-title { position:absolute; bottom:12px; left:12px; right:12px; text-align:center; font-size:14px; font-weight:700; }
        .channel-badge { position:absolute; top:10px; right:10px; background:var(--accent-primary); color:#fff; padding:3px 10px; border-radius:var(--radius-full); font-size:10px; font-weight:700; display:none; }
        .channel-card.playing .channel-badge { display:block; }
        .site-footer { padding:20px 10px; text-align:center; background:var(--bg-primary); border-top:1px solid rgba(255,255,255,0.08); color:var(--text-secondary); font-size:13px; margin-top:auto; }
        .site-footer a { color:var(--accent-primary); text-decoration:none; font-weight:600; }
        .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:var(--bg-elevated); padding:14px 24px; border-radius:var(--radius-full); font-size:14px; z-index:9999; opacity:0; transition:opacity 0.3s; pointer-events:none; display:flex; align-items:center; gap:8px; }
        .toast.show { opacity:1; }
        
        @keyframes loading { 0%{transform:translateX(-100%);} 100%{transform:translateX(350%);} }
        @media(min-width:768px) { .channels { grid-template-columns:repeat(4,1fr); gap:14px; padding:12px 28px 40px; } }
        
        /* ========== تصميم المشغل المدمج مع JWPlayer (بدون تغيير في الشكل الأصلي) ========== */
        #playerContainer {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid rgba(255,255,255,0.15);
        }
        #jwPlayerWrapper {
            width: 100%;
            height: 100%;
            position: relative;
        }
        /* إخفاء أزرار JWPlayer الافتراضية */
        .jw-controlbar, .jw-overlay, .jw-title-primary { display: none !important; }
        
        /* شريط التحكم المخصص */
        .custom-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
            padding: 20px 16px 12px;
            z-index: 30;
            transition: opacity 0.3s, transform 0.3s;
            opacity: 1;
            font-family: 'Cairo', sans-serif;
            direction: ltr;
        }
        .player-wrapper.autohide .custom-controls {
            opacity: 0;
            pointer-events: none;
        }
        .progress-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            direction: ltr;
        }
        .progress-wrapper {
            flex: 1;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
        }
        .progress-buffered {
            position: absolute;
            height: 100%;
            background: rgba(255,255,255,0.3);
            border-radius: 4px;
            width: 0%;
        }
        .progress-played {
            position: absolute;
            height: 100%;
            background: var(--accent-primary);
            border-radius: 4px;
            width: 0%;
        }
        .progress-handle {
            position: absolute;
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            left: 0%;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }
        .progress-wrapper:hover .progress-handle {
            opacity: 1;
        }
        .time-display {
            font-size: 13px;
            font-weight: 500;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 2px 6px;
            border-radius: 12px;
            font-family: monospace;
        }
        .actions-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .left-actions, .right-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .ctrl-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            font-size: 20px;
        }
        .ctrl-btn:hover {
            background: var(--accent-primary);
        }
        .volume-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .volume-slider {
            width: 70px;
            height: 3px;
            -webkit-appearance: none;
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            cursor: pointer;
        }
        .live-badge, .quality-pill {
            background: rgba(0,0,0,0.7);
            padding: 6px 12px;
            border-radius: 24px;
            font-size: 12px;
            font-weight: bold;
            border: none;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
        .live-badge.is-live {
            background: var(--accent-primary);
            color: white;
        }
        .quality-dropdown {
            position: absolute;
            bottom: 70px;
            right: 20px;
            background: #1e1e2f;
            border-radius: 12px;
            overflow: hidden;
            z-index: 35;
            display: none;
            flex-direction: column;
            min-width: 120px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .quality-option {
            padding: 10px 16px;
            background: transparent;
            border: none;
            color: white;
            text-align: right;
            cursor: pointer;
            font-family: 'Cairo';
            font-size: 13px;
        }
        .quality-option:hover, .quality-option.active {
            background: var(--accent-primary);
        }
        .dynamic-title {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 26;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: bold;
            pointer-events: none;
        }
        .match-live-badge {
            background: var(--accent-primary);
            padding: 2px 8px;
            border-radius: 20px;
            margin-left: 8px;
        }
        #loadingSpinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            z-index: 20;
            display: none;
        }
        @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
    </style>

    <script>
        // ========== البيانات وإدارة القنوات ==========
        let categories = [], allChannels = [], currentChannel = null;
        let jwPlayer = null;
        let isDVR = false;
        let controlsTimeout = null;
        
        // عناصر التحكم
        const playBtn = document.getElementById('playBtn');
        const muteBtn = document.getElementById('muteBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const qualityBtn = document.getElementById('qualityBtn');
        const liveBtn = document.getElementById('liveBtn');
        const volumeSliderCtrl = document.getElementById('volumeSlider');
        const progressWrapper = document.getElementById('progressWrapper');
        const progressPlayed = document.getElementById('progressPlayed');
        const progressBuffered = document.getElementById('progressBuffered');
        const progressHandle = document.getElementById('progressHandle');
        const currentTimeSpan = document.getElementById('currentTime');
        const totalTimeSpan = document.getElementById('totalTime');
        const progressRowDiv = document.getElementById('progressRow');
        const qualityDropdown = document.getElementById('qualityDropdown');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const customControls = document.getElementById('customControls');
        const playerContainer = document.getElementById('playerContainer');
        
        let isSeeking = false;
        
        function showToast(msg, icon='info') {
            const toast = document.getElementById('toast');
            toast.innerHTML = `<span class="material-icons-round">${icon}</span> ${msg}`;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }
        
        async function loadData() {
            try {
                const res = await fetch('data/api.json');
                if (!res.ok) throw new Error('فشل تحميل البيانات');
                const data = await res.json();
                categories = data.categories;
                allChannels = data.channels;
                const params = new URLSearchParams(window.location.search);
                const activeCategory = params.get('category') || 'all';
                let currentChannels = activeCategory === 'all' ? [...allChannels] : allChannels.filter(ch => ch.category_id == activeCategory);
                renderCategories();
                renderChannels(currentChannels);
                setTimeout(() => document.getElementById('splashScreen').classList.add('hidden'), 1500);
                if (currentChannels.length > 0) {
                    setTimeout(() => playChannel(currentChannels[0]), 500);
                }
            } catch (err) {
                console.error(err);
                showToast('فشل تحميل البيانات', 'error');
                document.getElementById('splashScreen').classList.add('hidden');
            }
        }
        
        function playChannel(channel) {
            if (!channel || !channel.stream_url) {
                showToast('لا يوجد رابط بث', 'error');
                return;
            }
            currentChannel = channel;
            loadingSpinner.style.display = 'block';
            
            if (jwPlayer) {
                jwPlayer.remove();
                jwPlayer = null;
            }
            
            const config = {
                file: channel.stream_url,
                type: channel.type === 'dash' ? 'dash' : 'hls',
                width: '100%',
                height: '100%',
                autostart: true,
                controls: false,
                mute: false,
                volume: 100,
                stretching: 'uniform'
            };
            
            if (channel.headers && channel.headers.length) {
                config.hlsjs = { onXhrOpen: function(xhr) { channel.headers.forEach(h => xhr.setRequestHeader(h.key, h.value)); } };
            }
            
            jwPlayer = jwplayer("jwPlayerWrapper");
            jwPlayer.setup(config);
            
            jwPlayer.on('ready', () => {
                loadingSpinner.style.display = 'none';
                updatePlayPauseIcon(false);
                jwPlayer.setVolume(volumeSliderCtrl.value * 100);
                checkDVRSupport();
                setupQualityMenu();
            });
            
            jwPlayer.on('play', () => { loadingSpinner.style.display = 'none'; updatePlayPauseIcon(false); });
            jwPlayer.on('pause', () => updatePlayPauseIcon(true));
            jwPlayer.on('buffer', () => { loadingSpinner.style.display = 'block'; });
            jwPlayer.on('error', (e) => { console.error(e); loadingSpinner.style.display = 'none'; showToast('خطأ في البث', 'error'); });
            jwPlayer.on('time', (e) => updateProgress(e));
            jwPlayer.on('levelsChanged', () => setupQualityMenu());
            
            document.querySelectorAll('.channel-card').forEach(card => card.classList.remove('playing'));
            const activeCard = document.querySelector(`.channel-card[data-id="${channel.id}"]`);
            if(activeCard) activeCard.classList.add('playing');
        }
        
        function updatePlayPauseIcon(isPaused) {
            playBtn.innerHTML = isPaused ? '<i class="ph-fill ph-play"></i>' : '<i class="ph-fill ph-pause"></i>';
        }
        
        function updateProgress(event) {
            if (!jwPlayer) return;
            const duration = jwPlayer.getDuration();
            const position = event.position;
            if (duration && !isNaN(duration) && duration > 0) {
                const percent = (position / duration) * 100;
                progressPlayed.style.width = percent + '%';
                progressHandle.style.left = percent + '%';
                currentTimeSpan.textContent = formatTime(position);
                totalTimeSpan.textContent = formatTime(duration);
            }
            // تحديث التقدم المُحمّل
            const bufferPercent = jwPlayer.getBuffer() * 100;
            progressBuffered.style.width = bufferPercent + '%';
        }
        
        function checkDVRSupport() {
            if (!jwPlayer) return;
            const seekRange = jwPlayer.getSeekRange();
            if (seekRange && seekRange.duration > 10) {
                isDVR = true;
                progressRowDiv.style.display = 'flex';
                liveBtn.style.display = 'inline-flex';
                // تحديث الوضع live
                const currentPos = jwPlayer.getPosition();
                const isAtLive = (seekRange.duration - (currentPos - seekRange.start)) < 5;
                liveBtn.classList.toggle('is-live', isAtLive);
                liveBtn.innerHTML = isAtLive ? 'مباشر' : 'العودة للبث';
            } else {
                isDVR = false;
                progressRowDiv.style.display = 'none';
                liveBtn.style.display = 'none';
            }
        }
        
        function setupQualityMenu() {
            if (!jwPlayer) return;
            const levels = jwPlayer.getQualityLevels();
            if (!levels || levels.length <= 1) {
                qualityBtn.style.opacity = '0.5';
                qualityBtn.style.pointerEvents = 'none';
                return;
            }
            qualityBtn.style.opacity = '1';
            qualityBtn.style.pointerEvents = 'auto';
            let html = '<button class="quality-option active" data-level="-1">تلقائي</button>';
            levels.forEach((level, idx) => {
                let label = level.label || (level.height ? `${level.height}p` : `جودة ${idx+1}`);
                html += `<button class="quality-option" data-level="${idx}">${label}</button>`;
            });
            qualityDropdown.innerHTML = html;
            const currentIdx = jwPlayer.getCurrentQuality();
            const options = qualityDropdown.querySelectorAll('.quality-option');
            if (options[currentIdx+1]) options[currentIdx+1].classList.add('active');
            else options[0].classList.add('active');
            
            qualityDropdown.querySelectorAll('.quality-option').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const level = parseInt(btn.dataset.level);
                    jwPlayer.setCurrentQuality(level);
                    qualityDropdown.style.display = 'none';
                });
            });
        }
        
        function seekToLive() {
            if (jwPlayer && isDVR) {
                const seekRange = jwPlayer.getSeekRange();
                if (seekRange) {
                    jwPlayer.seek(seekRange.duration - 2);
                    liveBtn.classList.add('is-live');
                    liveBtn.innerHTML = 'مباشر';
                }
            }
        }
        
        // أحداث التحكم المخصصة
        playBtn.addEventListener('click', () => {
            if (!jwPlayer) return;
            if (jwPlayer.getState() === 'playing') jwPlayer.pause();
            else jwPlayer.play();
        });
        
        muteBtn.addEventListener('click', () => {
            if (!jwPlayer) return;
            const isMuted = jwPlayer.getMute();
            jwPlayer.setMute(!isMuted);
            muteBtn.innerHTML = !isMuted ? '<i class="ph ph-speaker-slash"></i>' : '<i class="ph ph-speaker-high"></i>';
        });
        
        volumeSliderCtrl.addEventListener('input', (e) => {
            if (!jwPlayer) return;
            const val = parseFloat(e.target.value);
            jwPlayer.setVolume(val * 100);
            if (val === 0) muteBtn.innerHTML = '<i class="ph ph-speaker-slash"></i>';
            else muteBtn.innerHTML = '<i class="ph ph-speaker-high"></i>';
        });
        
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                playerContainer.requestFullscreen().catch(() => showToast('تعذر ملء الشاشة', 'error'));
            } else {
                document.exitFullscreen();
            }
        });
        document.addEventListener('fullscreenchange', () => {
            fullscreenBtn.innerHTML = document.fullscreenElement ? '<i class="ph ph-corners-in"></i>' : '<i class="ph ph-corners-out"></i>';
        });
        
        qualityBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            qualityDropdown.style.display = qualityDropdown.style.display === 'none' ? 'flex' : 'none';
        });
        document.addEventListener('click', () => qualityDropdown.style.display = 'none');
        
        liveBtn.addEventListener('click', seekToLive);
        
        // شريط التقدم
        if (progressWrapper) {
            progressWrapper.addEventListener('mousedown', (e) => {
                if (!isDVR) return;
                isSeeking = true;
                seekFromEvent(e);
            });
            document.addEventListener('mousemove', (e) => { if (isSeeking && isDVR) seekFromEvent(e); });
            document.addEventListener('mouseup', () => isSeeking = false);
            progressWrapper.addEventListener('touchstart', (e) => { isSeeking = true; seekFromEvent(e.touches[0]); });
            document.addEventListener('touchmove', (e) => { if (isSeeking && isDVR) seekFromEvent(e.touches[0]); });
            document.addEventListener('touchend', () => isSeeking = false);
            
            function seekFromEvent(e) {
                if (!jwPlayer || !isDVR) return;
                const rect = progressWrapper.getBoundingClientRect();
                let percent = (e.clientX - rect.left) / rect.width;
                percent = Math.min(1, Math.max(0, percent));
                const seekRange = jwPlayer.getSeekRange();
                if (seekRange) {
                    const seekTime = seekRange.start + (percent * seekRange.duration);
                    jwPlayer.seek(seekTime);
                }
            }
        }
        
        // إخفاء وإظهار الأزرار تلقائياً
        function showControls() {
            playerContainer.classList.remove('autohide');
            clearTimeout(controlsTimeout);
            if (jwPlayer && jwPlayer.getState() === 'playing') {
                controlsTimeout = setTimeout(() => playerContainer.classList.add('autohide'), 3000);
            }
        }
        playerContainer.addEventListener('mousemove', showControls);
        playerContainer.addEventListener('touchstart', showControls);
        customControls.addEventListener('mouseenter', () => clearTimeout(controlsTimeout));
        customControls.addEventListener('mouseleave', () => {
            if (jwPlayer && jwPlayer.getState() === 'playing')
                controlsTimeout = setTimeout(() => playerContainer.classList.add('autohide'), 1500);
        });
        
        function formatTime(sec) {
            sec = Math.abs(Math.round(sec));
            let h = Math.floor(sec / 3600);
            let m = Math.floor((sec % 3600) / 60);
            let s = sec % 60;
            if (h > 0) return `${h}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
            return `${m}:${s.toString().padStart(2,'0')}`;
        }
        
        // تصيير القنوات والفئات
        function renderCategories() {
            const nav = document.getElementById('categoriesNav');
            const activeCat = new URLSearchParams(window.location.search).get('category') || 'all';
            let html = `<div class="category ${activeCat==='all'?'active':''}" data-id="all">الكل</div>`;
            categories.forEach(c => {
                html += `<div class="category ${activeCat==c.id?'active':''}" data-id="${c.id}">${c.name}</div>`;
            });
            nav.innerHTML = html;
            nav.querySelectorAll('.category').forEach(cat => {
                cat.addEventListener('click', function() {
                    const id = this.dataset.id;
                    document.querySelectorAll('.category').forEach(c => c.classList.remove('active'));
                    this.classList.add('active');
                    const filtered = id === 'all' ? allChannels : allChannels.filter(ch => ch.category_id == id);
                    renderChannels(filtered);
                    history.pushState({}, '', id === 'all' ? 'index.html' : `?category=${id}`);
                });
            });
        }
        
        function renderChannels(channels) {
            const grid = document.getElementById('channelsGrid');
            if (!channels.length) {
                grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-muted)">لا توجد قنوات</div>';
                return;
            }
            grid.innerHTML = channels.map(ch => `
                <div class="channel-card" data-id="${ch.id}">
                    ${ch.is_active ? '<span class="channel-badge">مباشر</span>' : ''}
                    <img class="channel-image" src="${ch.logo_url || ''}" alt="${ch.name}">
                    <div class="channel-gradient"></div>
                    <div class="channel-title">${ch.name}</div>
                </div>
            `).join('');
            if (currentChannel) {
                const activeCard = document.querySelector(`.channel-card[data-id="${currentChannel.id}"]`);
                if(activeCard) activeCard.classList.add('playing');
            }
        }
        
        document.addEventListener('click', e => {
            const card = e.target.closest('.channel-card');
            if (card) {
                const id = parseInt(card.dataset.id);
                const channel = allChannels.find(ch => ch.id === id);
                if (channel) playChannel(channel);
            }
        });
        
        // البحث
        const searchInput = document.getElementById('searchInput');
        document.getElementById('searchToggle').addEventListener('click', () => {
            document.getElementById('searchBarContainer').classList.add('active');
            searchInput.focus();
        });
        document.getElementById('closeSearchBtn').addEventListener('click', () => {
            document.getElementById('searchBarContainer').classList.remove('active');
            searchInput.value = '';
            filterChannelsByName('');
        });
        searchInput.addEventListener('input', e => filterChannelsByName(e.target.value));
        function filterChannelsByName(term) {
            document.querySelectorAll('.channel-card').forEach(card => {
                const title = card.querySelector('.channel-title')?.textContent.toLowerCase() || '';
                card.style.opacity = title.includes(term.toLowerCase()) ? '1' : '0.3';
            });
        }
        
        // قائمة جانبية
        const menu = document.getElementById('menuOverlay');
        document.getElementById('menuToggle').addEventListener('click', () => { menu.classList.add('active'); document.body.style.overflow = 'hidden'; });
        document.getElementById('menuCloseBtn').addEventListener('click', () => { menu.classList.remove('active'); document.body.style.overflow = ''; });
        menu.addEventListener('click', (e) => { if (e.target === menu) { menu.classList.remove('active'); document.body.style.overflow = ''; } });
        
        loadData();
    </script>
</body>
</html>
